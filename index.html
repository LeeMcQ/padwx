<!doctype html>
<html lang="en-ZA">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050814" />
  <meta name="description" content="PadWx — SANSA pad weather for Hartebeesthoek (HBK) and Matjiesfontein (MTJ)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;560;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/padwx.css" />
  <title>PadWx — Matjiesfontein</title>
</head>
<body>
  <div class="app">
    <div class="site-toggle" id="siteToggle" role="group" aria-label="Site">
      <button type="button" data-site="hbk">HBK</button>
      <button type="button" data-site="mtj" aria-pressed="true">MTJ</button>
      <button type="button" data-site="both">Both</button>
    </div>

    <div id="banner" class="banner hidden" role="status"></div>
    <div id="boards" class="boards" aria-live="polite"></div>

    <div class="pager-dots" aria-hidden="true">
      <span class="on"></span><span></span><span></span><span></span>
    </div>

    <p class="footer-note">
      PadWx · SANSA HBK / MTJ ·
      <a href="widget.html">Widget</a> ·
      <a href="?view=widget&amp;site=mtj">MTJ widget view</a>
      <button type="button" id="refreshTop" class="btn-icon" style="display:inline-grid;vertical-align:middle;margin-left:.5rem;width:28px;height:28px" title="Refresh" aria-label="Refresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="14" height="14"><path d="M21 12a9 9 0 1 1-2.6-6.2"/><path d="M21 3v6h-6"/></svg>
      </button>
    </p>
  </div>

  <nav class="nav-pill" role="tablist" aria-label="Views">
    <button type="button" role="tab" data-tab="now" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      Now
    </button>
    <button type="button" role="tab" data-tab="trend" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 19V10M10 19V5M16 19v-7M22 19V8"/></svg>
      Trend
    </button>
    <button type="button" role="tab" data-tab="history" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      History
    </button>
  </nav>

  <script src="js/padwx.js" defer></script>
</body>
</html>
